<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071927"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="3"/>
  
  <!-- Outer subtle circular sound ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Waveform sound bars -->
  <g filter="url(#neonGlow)" fill="url(#waveGrad)">
    <rect x="110" y="200" width="34" height="112" rx="17"/>
    <rect x="164" y="140" width="34" height="232" rx="17"/>
    <rect x="218" y="90" width="34" height="332" rx="17"/>
    <rect x="272" y="120" width="34" height="272" rx="17"/>
    <rect x="326" y="170" width="34" height="172" rx="17"/>
    <rect x="380" y="215" width="34" height="82" rx="17"/>
  </g>

  <!-- Glowing central mic capsule indicator -->
  <circle cx="235" cy="256" r="26" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
